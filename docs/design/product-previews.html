<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<title>see-your-usage product illustrations</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fff;color:#29292c;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;letter-spacing:0}
.scene{width:760px;height:690px;padding:16px 20px;position:relative;overflow:hidden;background:#fff}
#codex{height:570px}
.menubar{height:38px;background:#e9e8ed;border-radius:11px 11px 0 0;display:flex;align-items:center;padding:0 16px;gap:20px;font-size:14px}
.finder{margin-right:auto;font-size:16px;font-weight:500}.clock{white-space:nowrap}.menubar svg{width:20px;height:20px;stroke-width:1.8}
.status{height:32px;width:88px;border-radius:6px;background:#d7d6de;display:flex;flex-direction:column;justify-content:center;padding:2px 10px;text-align:right;font-size:13px;line-height:14px;font-weight:600;font-variant-numeric:tabular-nums}
.green{color:#209c43}.yellow{color:#bd9000}.status.codex{width:126px;flex-direction:row;gap:7px;align-items:center;font-size:10px;padding:0 6px;white-space:nowrap}.mini{display:flex;gap:2px;flex:none}.mini i{height:6px;width:4px;background:#aaa9af;border-radius:3px}.mini i.on{background:#e7b900}
.popover{position:relative;width:444px;margin:18px 12px 0 auto;padding:22px;background:#eae9ee;border:1px solid #d2d2da;border-radius:18px;box-shadow:0 13px 32px #24212e12}
.popover::before{position:absolute;content:"";width:17px;height:17px;top:-10px;left:50%;background:#eae9ee;transform:rotate(45deg);border-top:1px solid #d2d2da;border-left:1px solid #d2d2da}
.header{display:flex;align-items:center;justify-content:space-between}.title{font-size:25px;font-weight:600;line-height:32px}.brand{font-size:14px;color:#77777f;margin-top:6px}.tools{display:flex;gap:17px;color:#7b7b84}.tools svg{width:21px;height:21px;stroke-width:1.7}.updated{font-size:13px;color:#797981;margin:27px 0 18px}
.metric{background:#f7f7f9;border-radius:13px;padding:18px;margin-top:13px}.row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}.label{font-size:15px;font-weight:500}.amount{font-size:31px;font-weight:600;line-height:36px;font-variant-numeric:tabular-nums;white-space:nowrap}.amount small{font-size:21px;font-weight:500;margin-right:2px}.caption{font-size:13px;color:#787880;margin-top:17px;line-height:19px;white-space:nowrap}.cells{height:11px;display:flex;gap:4px;margin:23px 0 17px}.cells i{flex:1;border-radius:4px;background:#dbdbe1}.cells i.on{background:#209c43}.cells.gold i.on{background:#e7b900}.reset{font-size:12px;color:#787880;display:flex;justify-content:space-between;gap:5px}.settings{border-top:1px solid #d2d2da;margin-top:22px;padding-top:19px;display:flex;align-items:center;justify-content:space-between;font-size:14px}.toggle{width:37px;height:22px;background:#087ff5;border-radius:20px;padding:3px}.toggle::after{content:"";display:block;float:right;background:#fff;width:16px;height:16px;border-radius:50%}.footer{display:flex;justify-content:space-between;margin-top:24px;font-size:13px;color:#797981}.link{color:#0980f8;display:flex;align-items:center;gap:4px}.link svg{width:14px;height:14px}.codex-panel .metric{padding-bottom:21px}.codex-panel .caption{margin-top:12px}.codex-panel .cells{margin-top:25px}.codex-panel .settings{margin-top:26px}.codex-panel{margin-top:18px}.codex-panel .popover::before{left:40%}
</style>
<div class="scene" id="llm-center">
 <div class="menubar"><span class="finder">Finder</span><div class="status"><span class="green">¥5,820</span><span>¥86.4</span></div><i data-lucide="wifi"></i><i data-lucide="battery-full"></i><span class="clock">周一 10:42</span></div>
 <div class="popover">
  <div class="header"><div><div class="title">LLM Center</div><div class="brand">see-your-usage</div></div><div class="tools"><i data-lucide="rotate-cw"></i><i data-lucide="pause"></i></div></div>
  <div class="updated">上次更新 10:42</div>
  <div class="metric"><div class="row"><span class="label">今日已用</span><span class="amount"><small>¥</small>86.4</span></div><div class="caption">今日 00:00 至今</div></div>
  <div class="metric"><div class="row"><span class="label">本月剩余</span><span class="amount green"><small>¥</small>5,820</span></div><div class="caption">已用 ¥1,180 / 月度额度 ¥7,000</div><div class="cells" data-total="18" data-filled="15"></div><div class="reset"><span>剩余 83.1%</span><span>10 月 1 日重置</span></div></div>
  <div class="settings"><span>开机启动</span><span class="toggle"></span></div>
  <div class="footer"><span>收起</span><span class="link">打开 LLM Center <i data-lucide="arrow-up-right"></i></span></div>
 </div>
</div>
<div class="scene" id="codex">
 <div class="menubar"><span class="finder">Finder</span><div class="status codex"><span class="mini" data-total="12" data-filled="5"></span><span>Sep 19</span></div><i data-lucide="wifi"></i><i data-lucide="battery-full"></i><span class="clock">周一 10:42</span></div>
 <div class="popover codex-panel">
  <div class="header"><div><div class="title">Codex</div><div class="brand">see-your-usage</div></div><div class="tools"><i data-lucide="rotate-cw"></i><i data-lucide="pause"></i></div></div>
  <div class="updated">上次更新 10:42</div>
  <div class="metric"><div class="row"><span class="label">本周剩余</span><span class="amount yellow">42<small>%</small></span></div><div class="caption">7 天用量窗口 · 已用 58%</div><div class="cells gold" data-total="18" data-filled="8"></div><div class="reset"><span>Pro</span><span>9 月 19 日重置</span></div></div>
  <div class="settings"><span>开机启动</span><span class="toggle"></span></div>
  <div class="footer"><span>收起</span><span class="link">打开 Codex 用量 <i data-lucide="arrow-up-right"></i></span></div>
 </div>
</div>
<script>
document.querySelectorAll('[data-total]').forEach(el=>{for(let i=0;i<Number(el.dataset.total);i++){const cell=document.createElement('i');if(i<Number(el.dataset.filled))cell.className='on';el.appendChild(cell)}});
</script>
</html>
